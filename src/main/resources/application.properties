spring.application.name=RunWith_Back

spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}

spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}

spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}

spring.jpa.show-sql=${SHOW_SQL:true}

#AWS S3 setting
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
spring.cloud.aws.region.static=${AWS_REGION}
spring.cloud.aws.s3.bucket.name=${AWS_S3_BUCKET_NAME}