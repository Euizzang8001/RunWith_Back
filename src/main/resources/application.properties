spring.application.name=RunWith_Back

spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}

spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}

spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}

#AWS S3 setting
spring.cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY:fakeAccessKey}
spring.cloud.aws.credentials.secretKey=${AWS_SECRET_KEY:fakeSecretKey}
spring.cloud.aws.region.static=${AWS_REGION:fakeRegion}
spring.cloud.aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:fakeS3BucketName}

#Firebase Test Token Get
firebase.web-api-key=${FIREBASE_WEB_API_KEY:fakeFirebaseWebApiKey}
firebase.base.key=${FIREBASE_BASE_KEY:fakeFirebaseBaseKey}

# Log Setting
logging.file.name=logs/application.log
logging.logback.rollingpolicy.file-name-pattern=logs/application-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=100MB
logging.level.org.hibernate.orm.jdbc.bind=${LOGGING_LEVEL:TRACE}

#Hibernate setting
spring.jpa.properties.hibernate.show_sql=${HIBERNATE_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}