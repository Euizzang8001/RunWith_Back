name: Build And Deploy (Multi-Env)

on:
  push:
    branches: [ "main", "develop" ] # main과 develop 브랜치 푸시 시 동작

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 브랜치에 따라 변수 다르게 등록
      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.base_ref }}" == "main" ]]; then
            echo "Building for PRODUCTION (main)"
            echo "TARGET_TAG=${{ secrets.DOCKER_PROD_TAG }}" >> $GITHUB_ENV
            echo "BUILD_PORT=${{ secrets.SERVER_OUTER_PROD_PORT }}" >> $GITHUB_ENV
          else
            echo "Building for DEVELOPMENT (dev)"
            echo "TARGET_TAG=${{ secrets.DOCKER_DEV_TAG }}" >> $GITHUB_ENV
            echo "BUILD_PORT=${{ secrets.SERVER_OUTER_DEV_PORT }}" >> $GITHUB_ENV
          fi
          
          echo 

      # 도커 허브 로그인
      # 도커 허브에 이미지를 push한 후, deploy시 다운 받을 예정
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 도커 허브에 이미지 build and push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . # Dockerfile이 있는 경로
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ env.TARGET_TAG }}
          build-args: |
            PORT=${{ env.BUILD_PORT }} 

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      # deploy 잡에서 실행될 때 필요한 secret설정 -> main과 dev 분리
      - name: Set Environment Variables for Deploy
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "Deploying to PRODUCTION"
            echo "TARGET_TAG=${{ secrets.DOCKER_PROD_TAG }}" >> $GITHUB_ENV
            echo "INNER_PORT=${{ secrets.SERVER_PROD_INNER_PORT }}" >> $GITHUB_ENV
            echo "OUTER_PORT=${{ secrets.SERVER_OUTER_PROD_PORT }}" >> $GITHUB_ENV
            echo "CONTAINER_NAME=${{ secrets.DOCKER_PROD_CONTAINER }}" >> $GITHUB_ENV
          else
            echo "Deploying to DEVELOPMENT"
            echo "TARGET_TAG=${{ secrets.DOCKER_DEV_TAG }}" >> $GITHUB_ENV
            echo "INNER_PORT=${{ secrets.SERVER_DEV_INNER_PORT }}" >> $GITHUB_ENV
            echo "OUTER_PORT=${{ secrets.SERVER_OUTER_DEV_PORT }}" >> $GITHUB_ENV
            echo "CONTAINER_NAME=${{ secrets.DOCKER_DEV_CONTAINER }}" >> $GITHUB_ENV
          fi
          
          echo "prod container name: ${{ secrets.DOCKER_PROD_CONTAINER }}"
          echo "dev container name: ${{ secrets.DOCKER_DEV_CONTAINER }}"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          script: |
            # 환경변수를 스크립트 내 변수로 저장 (가독성 및 안전성)
            IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}"
            TAG="${{ env.TARGET_TAG }}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            INNER_PORT="${{ env.INNER_PORT }}"
            OUTER_PORT="${{ env.OUTER_PORT }}"
            
            echo "Deploying $IMAGE_NAME:$TAG to Port $OUTER_PORT:$INNER_PORT"
            
            # env파일 동적 생성
            echo "env파일 생성"
            cat <<EOF > .env
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DRIVER=${{ secrets.DB_DRIVER }}
            DB_PLATFORM=${{ secrets.DB_PLATFORM }}
            DDL_AUTO=${{ secrets.DDL_AUTO }}
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
            EOF
            
            #도커 로그인
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # 도커 허브로부터 도커 이미지 받기
            sudo docker pull $IMAGE_NAME:$TAG
            
            echo "container name: $CONTAINER_NAME"
            # 기존 컨테이너 중지 및 삭제
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true
            
            # 새 컨테이너 실행
            sudo docker run -d \
              -p ${OUTER_PORT}:${INNER_PORT} \
              --name $CONTAINER_NAME \
              --env-file .env \
              $IMAGE_NAME:$TAG
            
            #컨테이너 실행 후 env 삭제
            sudo rm .env
            
            # 미사용 이미지 정리
            sudo docker image prune -f