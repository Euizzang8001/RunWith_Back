name: Build And Deploy (Multi-Env)

on:
  push:
    branches: [ "master", "develop" ] # master와 develop 브랜치 푸시 시 동작

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    environment: ${{ github.ref_name == 'master' && 'master'|| 'develop' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 도커 허브 로그인
      # 도커 허브에 이미지를 push한 후, deploy시 다운 받을 예정
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 도커 허브에 이미지 build and push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . # Dockerfile이 있는 경로
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ secrets.DOCKER_TAG }}
          build-args: |
            PORT=${{ secrets.SERVER_OUTER_PORT }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    environment: ${{ github.ref_name == 'master' && 'master'|| 'develop' }}
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        env:
          # cicd 서버에 따른 변수
          TARGET_TAG: ${{ secrets.DOCKER_TAG }}
          CONTAINER_NAME: ${{ secrets.DOCKER_CONTAINER_NAME }}
          INNER_PORT: ${{ secrets.SERVER_INNER_PORT }}
          OUTER_PORT: ${{ secrets.SERVER_OUTER_PORT }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DRIVER: ${{ secrets.DB_DRIVER }}
          DB_PLATFORM: ${{ secrets.DB_PLATFORM }}
          DDL_AUTO: ${{ secrets.DDL_AUTO }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          HIBERNATE_SHOW_SQL: ${{ secrets.HIBERNATE_SHOW_SQL }}
          HIBERNATE_FORMAT_SQL: ${{ secrets.HIBERNATE_FORMAT_SQL }}
          LOGGING_LEVEL: ${{ secrets.LOGGING_LEVEL }}
          SERVER_TYPE: ${{ secrets.SERVER_TYPE }}

          # 공통 변수
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_BASE_KEY: ${{ secrets.FIREBASE_BASE_KEY }}

        with:
          # 운영 - 개발 서버 분리
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          # 정의한 env값들 EC2로 전달
          envs: TARGET_TAG,CONTAINER_NAME,INNER_PORT,OUTER_PORT,DB_URL,DB_USERNAME,DB_PASSWORD,DB_DRIVER,DB_PLATFORM,DDL_AUTO,AWS_ACCESS_KEY,AWS_SECRET_KEY,AWS_REGION,AWS_S3_BUCKET_NAME,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_IMAGE,FIREBASE_WEB_API_KEY,FIREBASE_BASE_KEY,HIBERNATE_SHOW_SQL,HIBERNATE_FORMAT_SQL,LOGGING_LEVEL,SERVER_TYPE
          script: |
            IMAGE_NAME="$DOCKER_USERNAME/$DOCKER_IMAGE"
            
            echo "Deploying $IMAGE_NAME:$TARGET_TAG to Port $OUTER_PORT:$INNER_PORT"
            
            # 도커 로그인
            echo "$DOCKER_PASSWORD" | sudo docker login -u "$DOCKER_USERNAME" --password-stdin
            
            # 도커 허브로부터 도커 이미지 받기
            sudo docker pull $IMAGE_NAME:$TARGET_TAG
            
            echo "container name: $CONTAINER_NAME"
            # 기존 컨테이너 중지 및 삭제
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true
            
            # 환경변수 파일 세팅 (.env)
            echo "DB_URL=$DB_URL" > .env
            echo "DB_USERNAME=$DB_USERNAME" >> .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "DB_DRIVER=$DB_DRIVER" >> .env
            echo "DB_PLATFORM=$DB_PLATFORM" >> .env
            echo "DDL_AUTO=$DDL_AUTO" >> .env
            echo "AWS_ACCESS_KEY=$AWS_ACCESS_KEY" >> .env
            echo "AWS_SECRET_KEY=$AWS_SECRET_KEY" >> .env
            echo "AWS_REGION=$AWS_REGION" >> .env
            echo "AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME" >> .env
            echo "FIREBASE_WEB_API_KEY=$FIREBASE_WEB_API_KEY" >> .env
            echo "FIREBASE_BASE_KEY=$FIREBASE_BASE_KEY" >> .env
            echo "HIBERNATE_SHOW_SQL=$HIBERNATE_SHOW_SQL" >> .env
            echo "HIBERNATE_FORMAT_SQL=$HIBERNATE_FORMAT_SQL" >> .env
            echo "LOGGING_LEVEL=$LOGGING_LEVEL">> .env
            echo "SERVER_TYPE=$SERVER_TYPE" >> .env
            
            # 새 컨테이너 실행
            sudo docker run -d \
              -p ${OUTER_PORT}:${INNER_PORT} \
              --name $CONTAINER_NAME \
              --env-file .env \
              $IMAGE_NAME:$TARGET_TAG
            
            # 실행 후 환경변수 파일 삭제
            sudo rm .env
            
            # 미사용 이미지 정리
            sudo docker image prune -f
